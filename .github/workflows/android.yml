name: Android CI

on:
  push:
    branches: [ main, develop ]
    paths: [ 'apps/android/**', '.github/workflows/android.yml' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'apps/android/**', '.github/workflows/android.yml' ]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx2048m"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-channel: 3
          licenses: true

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Display versions
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          ./gradlew --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        working-directory: apps/android
        run: ./gradlew lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flowww-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        with:
          name: flowww-android-lint-results
          path: apps/android/app/build/reports/lint-results*
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: flowww-android-test-results
          path: apps/android/app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 7

name: Android CI

on:
  push:
    branches: [ main, develop ]
    paths: [ 'apps/android/**', '.github/workflows/android.yml' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'apps/android/**', '.github/workflows/android.yml' ]

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx2048m"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          build-tool: 34.0.0
          cmake: 3.22.1
          ndk: 27.0.12077973
          extras: android_m2repository,google_m2repository
          packages: platform-tools,platforms;android-34,build-tools;34.0.0

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514d83c27ed293652694" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        working-directory: apps/android
        run: ./gradlew test --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flowww-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: flowww-android-test-results
          path: apps/android/app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          build-tool: 34.0.0
          cmake: 3.22.1
          ndk: 27.0.12077973
          extras: android_m2repository,google_m2repository
          packages: platform-tools,platforms;android-34,build-tools;34.0.0

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514d83c27ed293652694" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Run lint
        working-directory: apps/android
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        with:
          name: flowww-android-lint-results
          path: apps/android/app/build/reports/lint-results*
          retention-days: 7

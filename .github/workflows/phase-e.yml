name: Phase E Cross-Device Reliability

on:
  push:
    branches: [feat/phase-e-cross-device-reliability]
  pull_request:
    branches: [feat/phase-e-cross-device-reliability]

env:
  RUST_VERSION: "1.82"
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    name: Rust workspace tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: x86_64-pc-windows-msvc
          override: true

      - name: Install build tools
        run: |
          choco install strawberryperl nasm -y
          RefreshEnv

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo test --workspace
        run: |
          $env:Path = "C:\msys64\ucrt64\bin;$env:Path"
          cargo test --workspace

  android-build:
    name: Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build release APK
        run: |
          cd apps/android
          ./gradlew :app:assembleRelease

      - name: Run Android unit tests
        run: |
          cd apps/android
          ./gradlew :app:testDebugUnitTest

      - name: Generate APK checksums
        run: |
          cd apps/android/app/build/outputs/apk/release
          sha256sum app-release.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowww-release-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: flowww-apk-checksums
          path: apps/android/app/build/outputs/apk/release/SHA256SUMS.txt

  windows-installer:
    name: Windows installer (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: x86_64-pc-windows-msvc
          override: true

      - name: Install WiX toolset
        run: |
          choco install wixtoolset -y
          RefreshEnv

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msvc-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Windows desktop agent (MSVC)
        run: |
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  final-report:
    name: Final report
    needs: [rust-tests, android-build, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APK checksums
        uses: actions/download-artifact@v4
        with:
          name: flowww-apk-checksums
          path: ./checksums

      - name: Publish release notes
        run: |
          echo "## Phase E Cross-Device Reliability — Release" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Artifacts" >> RELEASE_NOTES.md
          echo "- Android release APK: app-release.apk" >> RELEASE_NOTES.md
          echo "- SHA-256:" >> RELEASE_NOTES.md
          cat ./checksums/SHA256SUMS.txt >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

name: Phase E Cross-Device Reliability

on:
  push:
    branches: [feat/phase-e-cross-device-reliability]
  pull_request:
    branches: [feat/phase-e-cross-device-reliability]

env:
  RUST_VERSION: "1.82"
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    name: Rust workspace tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo test --workspace
        run: cargo test --workspace

  android-build:
    name: Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build release APK
        run: |
          cd apps/android
          ./gradlew :app:assembleRelease

      - name: Run Android unit tests
        run: |
          cd apps/android
          ./gradlew :app:testDebugUnitTest

      - name: Generate APK checksums
        run: |
          cd apps/android/app/build/outputs/apk/release
          sha256sum app-release.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowww-release-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: flowww-apk-checksums
          path: apps/android/app/build/outputs/apk/release/SHA256SUMS.txt

  windows-build:
    name: Windows desktop EXE (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: x86_64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msvc-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('apps/desktop/package-lock.json') }}

      - name: Install npm dependencies
        run: cd apps/desktop && npm ci

      - name: Build frontend
        run: cd apps/desktop && npm run build

      - name: Build Windows desktop EXE (tauri build)
        run: cd apps/desktop/src-tauri && npx tauri build

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowww-windows-exe
          path: apps/desktop/src-tauri/target/release/flowww-desktop.exe

      - name: Upload Windows EXE checksums
        run: |
          cd apps/desktop/src-tauri/target/release
          sha256sum flowww-desktop.exe > flowww-desktop.exe.sha256
          cat flowww-desktop.exe.sha256
        uses: actions/upload-artifact@v4
        with:
          name: flowww-windows-exe-checksums
          path: apps/desktop/src-tauri/target/release/flowww-desktop.exe.sha256

  final-report:
    name: Final report
    needs: [rust-tests, android-build, windows-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APK checksums
        uses: actions/download-artifact@v4
        with:
          name: flowww-apk-checksums
          path: ./checksums

      - name: Download Windows EXE checksums
        uses: actions/download-artifact@v4
        with:
          name: flowww-windows-exe-checksums
          path: ./windows-checksums

      - name: Publish release notes
        run: |
          echo "## Phase E Cross-Device Reliability — Release" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Artifacts" >> RELEASE_NOTES.md
          echo "- Android release APK: app-release.apk" >> RELEASE_NOTES.md
          echo "- Windows desktop EXE: flowww-desktop.exe" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### SHA-256 Checksums" >> RELEASE_NOTES.md
          cat ./checksums/SHA256SUMS.txt >> RELEASE_NOTES.md
          cat ./windows-checksums/flowww-desktop.exe.sha256 >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

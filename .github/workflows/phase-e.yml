name: Phase E validation

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust format, check, test and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets

  android:
    name: Android compile, tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and unit test
        working-directory: apps/android
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon
      - name: Lint
        working-directory: apps/android
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Assemble unsigned release artifact
        working-directory: apps/android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Hash Android artifact
        shell: bash
        run: |
          apk=$(find apps/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$apk"
          sha256sum "$apk" > "$apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: flowww-android-unsigned-release
          path: |
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/apk/release/*.sha256

  windows-desktop:
    name: Windows desktop Rust check and tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo check
      - run: cargo test

  windows-package:
    name: Windows Tauri installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run build
      - run: npm run tauri build -- --bundles nsis
      - name: Hash Windows installers
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' } |
            ForEach-Object {
              (Get-FileHash $_.FullName -Algorithm SHA256).Hash + "  " + $_.Name |
                Out-File ($_.FullName + '.sha256') -Encoding ascii
            }
      - uses: actions/upload-artifact@v4
        with:
          name: flowww-windows-installer
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.sha256

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowww</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      width: 320px;
      background: #ffffff;
      color: #1a1a1a;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 16px 0;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .status {
      padding: 12px 16px;
      background: #f5f5f5;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #4a4a4a;
    }
    .status.connected { color: #2e7d32; }
    .status.disconnected { color: #c62828; }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    button {
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s;
    }
    button.primary {
      background: #ff7a1d;
      color: #ffffff;
    }
    button.primary:hover { background: #e66e18; }
    button.secondary {
      background: #f5f5f5;
      color: #1a1a1a;
    }
    button.secondary:hover { background: #e8e8e8; }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .section {
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #666;
      margin-bottom: 8px;
    }
    .recent-item {
      padding: 8px 12px;
      background: #f9f9f9;
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .divider {
      height: 1px;
      background: #e8e8e8;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <h1>Flowww</h1>

  <div class="status" id="status">
    <span id="status-text">Connecting...</span>
  </div>

  <div class="button-group">
    <button class="primary" id="stagePage">Stage Current Page</button>
    <button class="secondary" id="stageSelection">Stage Selected Text</button>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-title">Recently Staged</div>
    <div id="recentStaged"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>

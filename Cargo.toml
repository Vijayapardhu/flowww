[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/Vijayapardhu/flowww"

[workspace.dependencies]
uniffi = "0.32.2"
anyhow = "1.0"
axum = { version = "0.8", features = ["ws", "multipart"] }
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
ed25519-dalek = { version = "2.2", features = ["rand_core", "serde", "zeroize"] }
futures-util = "0.3"
hex = "0.4"
http = "1.3"
mdns-sd = "0.21"
mime_guess = "2.0"
qrcode = { version = "0.14", features = ["svg"] }
rand = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.16", features = ["v4", "v5", "serde"] }
zeroize = "1.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

flowww-core = { path = "crates/flowww-core" }
flowww-protocol = { path = "crates/flowww-protocol" }
flowww-security = { path = "crates/flowww-security" }
flowww-storage = { path = "crates/flowww-storage" }
flowww-discovery = { path = "crates/flowww-discovery" }
flowww-network = { path = "crates/flowww-network" }
flowww-transfer = { path = "crates/flowww-transfer" }
flowww-spatial = { path = "crates/flowww-spatial" }
flowww-node = { path = "crates/flowww-node" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Like `release`, but keeps the symbol table. UniFFI embeds its interface
# metadata in UNIFFI_META_* symbols, and `uniffi-bindgen` reads them back out
# of the cdylib to generate Kotlin bindings. Stripping the .so would delete
# the metadata, so the Android library builds with this profile instead.
[profile.release-android]
inherits = "release"
strip = false
